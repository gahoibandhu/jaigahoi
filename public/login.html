<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login — गहोई पोर्टल</title>

  <link rel="stylesheet" href="common.css">

  <!-- Supabase JS MUST load first -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>

<body>

  <div class="gp-header">
    <img
      src="https://res.cloudinary.com/dtcrife6i/image/upload/f_auto,q_auto/New_-_Logo_aktdtf.png"
      alt="गहोई पोर्टल"
    >

    <div>
      <h1>गहोई पोर्टल</h1>
      <p class="gp-header-sub">
        All India Gahoi Vaishya Samaj Community Portal
      </p>
    </div>
  </div>


  <div class="gp-container">

    <div class="gp-card">

      <h2>Login करें</h2>

      <p class="gp-subtitle">
        अपने account में वापस आइए
      </p>

      <div
        id="loginAlert"
        class="gp-alert"
        style="display:none;"
      ></div>


      <!-- Google Login -->

      <button
        type="button"
        class="gp-btn gp-btn-google"
        id="googleLoginBtn"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 18 18"
          aria-hidden="true"
        >
          <path
            fill="#4285F4"
            d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.92a8.78 8.78 0 002.68-6.62z"
          />
          <path
            fill="#34A853"
            d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86a5.19 5.19 0 01-4.87-3.6H1.1v2.33A9 9 0 009 18z"
          />
          <path
            fill="#FBBC05"
            d="M4.13 10.82a5.4 5.4 0 010-3.64V4.85H1.1a9 9 0 000 8.3l3.03-2.33z"
          />
          <path
            fill="#EA4335"
            d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58A8.6 8.6 0 009 0 9 9 0 001.1 4.85l3.03 2.33A5.19 5.19 0 019 3.58z"
          />
        </svg>

        Google से Login करें
      </button>


      <div class="gp-divider">
        या Email से
      </div>


      <!-- Email Login -->

      <form id="loginForm">

        <div class="gp-field">
          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            required
            autocomplete="email"
          >
        </div>


        <div class="gp-field">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            required
            autocomplete="current-password"
          >

          <div class="gp-hint">
            <a href="forgot-password.html">
              Password भूल गए?
            </a>
          </div>

        </div>


        <button
          type="submit"
          class="gp-btn"
          id="loginSubmitBtn"
        >
          Login करें
        </button>

      </form>


      <p class="gp-footer-link">
        नए हैं?
        <a href="register.html">
          Registration करें
        </a>
      </p>

    </div>

  </div>


  <!--
    IMPORTANT SCRIPT ORDER:

    1. Supabase CDN
    2. config.js
    3. common.js
    4. login page JavaScript
  -->

  <script src="config.js"></script>
  <script src="common.js"></script>


  <script>
    // -----------------------------------------------------------------------
    // Safety check
    // -----------------------------------------------------------------------

    if (
      typeof window.supabase === "undefined"
    ) {
      console.error(
        "Supabase library did not load."
      );
    }

    if (
      typeof window.GP_CONFIG === "undefined"
    ) {
      console.error(
        "config.js did not load."
      );
    }

    if (
      typeof gpSupabase === "undefined"
    ) {
      console.error(
        "common.js did not initialize gpSupabase."
      );
    }


    // -----------------------------------------------------------------------
    // Already logged in?
    // -----------------------------------------------------------------------

    (async function checkExistingSession() {

      try {

        const {
          data,
          error
        } = await gpSupabase.auth.getSession();


        if (error) {
          console.error(
            "getSession error:",
            error
          );
          return;
        }


        if (data && data.session) {

          window.location.href =
            "home.html";

        }

      } catch (error) {

        console.error(
          "Session check failed:",
          error
        );

      }

    })();


    // -----------------------------------------------------------------------
    // Email/password login
    // -----------------------------------------------------------------------

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async function (e) {

          e.preventDefault();

          gpHideAlert("loginAlert");


          const btn =
            document.getElementById(
              "loginSubmitBtn"
            );


          btn.disabled = true;

          btn.textContent =
            "कृपया प्रतीक्षा करें...";


          const email =
            document
              .getElementById("email")
              .value
              .trim();


          const password =
            document
              .getElementById("password")
              .value;


          try {

            const {
              data,
              error
            } =
              await gpSupabase.auth
                .signInWithPassword({
                  email: email,
                  password: password
                });


            if (error) {

              console.error(
                "Email login error:",
                error
              );


              gpShowAlert(
                "loginAlert",
                "Login असफल — Email या Password ग़लत है।",
                "error"
              );


              btn.disabled = false;

              btn.textContent =
                "Login करें";

              return;

            }


            if (!data || !data.user) {

              gpShowAlert(
                "loginAlert",
                "Login सफल नहीं हो सका। कृपया फिर कोशिश करें।",
                "error"
              );


              btn.disabled = false;

              btn.textContent =
                "Login करें";

              return;

            }


            // ---------------------------------------------------------------
            // Profile check
            // ---------------------------------------------------------------

            const profile =
              await gpGetMyProfile();


            if (!profile) {

              window.location.href =
                "complete-profile.html";

              return;

            }


            if (
              profile.status ===
              "Pending"
            ) {

              window.location.href =
                "pending-approval.html";

              return;

            }


            window.location.href =
              "home.html";

          } catch (error) {

            console.error(
              "Login exception:",
              error
            );


            gpShowAlert(
              "loginAlert",
              "Login के दौरान समस्या हुई। कृपया फिर कोशिश करें।",
              "error"
            );


            btn.disabled = false;

            btn.textContent =
              "Login करें";

          }

        }
      );


    // -----------------------------------------------------------------------
    // Google OAuth
    // -----------------------------------------------------------------------

    document
      .getElementById("googleLoginBtn")
      .addEventListener(
        "click",
        async function () {

          gpHideAlert(
            "loginAlert"
          );


          const btn =
            document.getElementById(
              "googleLoginBtn"
            );


          btn.disabled = true;

          btn.textContent =
            "Google Login शुरू हो रहा है...";


          try {

            const redirectTo =
              window.location.origin +
              "/auth-callback.html";


            console.log(
              "Google OAuth redirect:",
              redirectTo
            );


            const {
              data,
              error
            } =
              await gpSupabase.auth
                .signInWithOAuth({

                  provider: "google",

                  options: {

                    redirectTo:
                      redirectTo

                  }

                });


            if (error) {

              console.error(
                "Google OAuth error:",
                error
              );


              gpShowAlert(
                "loginAlert",
                "Google Login शुरू नहीं हो सका — फिर कोशिश करें।",
                "error"
              );


              btn.disabled = false;

              btn.innerHTML =
                "Google से Login करें";

              return;

            }

            /*
              Supabase normally redirects the browser automatically.
              Nothing else should be done here.
            */

            console.log(
              "Google OAuth started:",
              data
            );

          } catch (error) {

            console.error(
              "Google OAuth exception:",
              error
            );


            gpShowAlert(
              "loginAlert",
              "Google Login में समस्या हुई। कृपया फिर कोशिश करें।",
              "error"
            );


            btn.disabled = false;

            btn.innerHTML =
              "Google से Login करें";

          }

        }
      );
  </script>

</body>
</html>
