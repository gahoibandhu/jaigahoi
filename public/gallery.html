<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — गहोई पोर्टल</title>
  <link rel="stylesheet" href="common.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    .gp-wrap { max-width: 900px; margin: 0 auto; padding: 20px; }
    .gp-toggle-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .gp-toggle-tabs button {
      padding: 9px 18px; border-radius: 8px; border: 1.5px solid var(--gp-border);
      background: #fff; cursor: pointer; font-weight: 700; font-size: .88rem;
    }
    .gp-toggle-tabs button.active { background: var(--gp-navy); color: #fff; border-color: var(--gp-navy); }
    .gp-gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .gp-gallery-item { position: relative; border-radius: var(--gp-radius); overflow: hidden; box-shadow: var(--gp-shadow); background: var(--gp-card); }
    .gp-gallery-item img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .gp-gallery-caption { padding: 8px 10px; font-size: .8rem; color: var(--gp-text-muted); }
    .gp-gallery-album { display: inline-block; font-size: .72rem; font-weight: 700; color: var(--gp-gold-dark); background: var(--gp-warning-bg); padding: 2px 8px; border-radius: 10px; margin-bottom: 4px; }
    .gp-gallery-delete { position: absolute; top: 6px; right: 6px; background: rgba(183,28,28,.9); color: #fff; border: none; border-radius: 6px; font-size: .72rem; padding: 3px 7px; cursor: pointer; }
    .gp-empty { text-align: center; color: var(--gp-text-muted); padding: 40px 0; }
  </style>
</head>
<body>

  <div class="gp-header">
    <img src="https://res.cloudinary.com/dtcrife6i/image/upload/f_auto,q_auto/New_-_Logo_aktdtf.png" alt="गहोई पोर्टल">
    <div><h1>🖼 Gallery</h1><p class="gp-header-sub">गहोई पोर्टल</p></div>
  </div>

  <div class="gp-wrap">
    <p><a href="home.html">← होम पर वापस</a></p>

    <div class="gp-toggle-tabs">
      <button id="browseTab" class="active">📋 देखें</button>
      <button id="postTab" style="display:none">➕ नई Photo Upload करें</button>
    </div>

    <div id="galAlert" class="gp-alert"></div>

    <div id="browseSection">
      <div id="galGrid" class="gp-gallery-grid"></div>
    </div>

    <div id="postSection" style="display:none">
      <div class="gp-section" style="background:var(--gp-card); border-radius:var(--gp-radius-lg); padding:20px; box-shadow:var(--gp-shadow); max-width:440px">
        <form id="galForm">
          <div class="gp-field"><label>Photo URL *</label><input type="text" id="url" required></div>
          <div class="gp-field"><label>Caption</label><input type="text" id="caption"></div>
          <div class="gp-field"><label>Album</label><input type="text" id="album" placeholder="General"></div>
          <button type="submit" class="gp-btn" id="galSubmitBtn">Upload करें</button>
        </form>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    let myRole = null;

    async function loadGallery() {
      const { data, error } = await gpSupabase
        .from("gallery")
        .select("*")
        .is("deleted_at", null)
        .order("created_at", { ascending: false });

      const gridEl = document.getElementById("galGrid");
      gridEl.innerHTML = "";
      if (error) { gpShowAlert("galAlert", "Load नहीं हो सका: " + error.message, "error"); return; }
      if (!data || data.length === 0) { gridEl.innerHTML = `<div class="gp-empty">अभी कोई photo नहीं है।</div>`; return; }

      const canDelete = myRole === "Admin" || myRole === "Approver";
      data.forEach((g) => {
        const item = document.createElement("div");
        item.className = "gp-gallery-item";
        item.innerHTML = `
          <img src="${g.url}" alt="${g.caption || ""}" loading="lazy">
          ${canDelete ? `<button class="gp-gallery-delete" data-id="${g.id}">🗑</button>` : ""}
          <div class="gp-gallery-caption">
            ${g.album ? `<span class="gp-gallery-album">${g.album}</span><br>` : ""}
            ${g.caption || ""}
          </div>
        `;
        gridEl.appendChild(item);
      });

      gridEl.querySelectorAll(".gp-gallery-delete").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("क्या आप वाकई इस photo को हटाना चाहते हैं?")) return;
          const { error } = await gpSupabase
            .from("gallery")
            .update({ deleted_at: new Date().toISOString() })
            .eq("id", btn.getAttribute("data-id"));
          if (error) { gpShowAlert("galAlert", "हटाया नहीं जा सका: " + error.message, "error"); return; }
          loadGallery();
        });
      });
    }

    document.getElementById("browseTab").addEventListener("click", () => {
      document.getElementById("browseTab").classList.add("active");
      document.getElementById("postTab").classList.remove("active");
      document.getElementById("browseSection").style.display = "block";
      document.getElementById("postSection").style.display = "none";
    });
    document.getElementById("postTab").addEventListener("click", () => {
      document.getElementById("postTab").classList.add("active");
      document.getElementById("browseTab").classList.remove("active");
      document.getElementById("postSection").style.display = "block";
      document.getElementById("browseSection").style.display = "none";
    });

    document.getElementById("galForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      gpHideAlert("galAlert");
      const btn = document.getElementById("galSubmitBtn");
      btn.disabled = true;
      btn.textContent = "Upload हो रहा है...";

      const { error } = await gpSupabase.from("gallery").insert({
        url: document.getElementById("url").value.trim(),
        caption: document.getElementById("caption").value.trim(),
        album: document.getElementById("album").value.trim() || "General",
      });

      btn.disabled = false;
      btn.textContent = "Upload करें";

      if (error) { gpShowAlert("galAlert", "Upload नहीं हो सका: " + error.message, "error"); return; }
      document.getElementById("galForm").reset();
      document.getElementById("browseTab").click();
      loadGallery();
    });

    (async () => {
      const session = await gpRequireLogin("login.html");
      if (!session) return;
      const profile = await gpGetMyProfile();
      if (!profile) { window.location.href = "complete-profile.html"; return; }
      if (profile.status !== "Approved") { window.location.href = "pending-approval.html"; return; }
      if (!(await gpGuardFeature("galleryEnabled", "Gallery"))) return;
      myRole = profile.role;
      // gallery लिखना is_approver_or_admin() (RLS) — दोनों को tab दिखाएं
      if (myRole === "Admin" || myRole === "Approver") document.getElementById("postTab").style.display = "inline-block";
      await loadGallery();
    })();
  </script>
</body>
</html>
