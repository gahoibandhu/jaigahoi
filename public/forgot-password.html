<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset — गहोई पोर्टल</title>
  <link rel="stylesheet" href="common.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

  <div class="gp-header">
    <img src="https://res.cloudinary.com/dtcrife6i/image/upload/f_auto,q_auto/New_-_Logo_aktdtf.png" alt="गहोई पोर्टल">
    <div>
      <h1>गहोई पोर्टल</h1>
      <p class="gp-header-sub">All India Gahoi Vaishya Samaj Community Portal</p>
    </div>
  </div>

  <div class="gp-container">
    <div class="gp-card" id="requestCard">
      <h2>Password भूल गए?</h2>
      <p class="gp-subtitle">अपनी registered email डालें, हम reset-link भेज देंगे</p>

      <div id="fpAlert" class="gp-alert"></div>

      <form id="fpForm">
        <div class="gp-field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <button type="submit" class="gp-btn" id="fpSubmitBtn">Reset-Link भेजें</button>
      </form>

      <p class="gp-footer-link"><a href="login.html">← Login पर वापस जाएं</a></p>
    </div>

    <div class="gp-card" id="sentCard" style="display:none">
      <h2>📧 Link भेज दी गई</h2>
      <div class="gp-alert gp-alert-success" style="display:block">
        <span id="sentToEmail"></span> पर एक password-reset link भेजी गई है। Link पर click करके नया password बनाएं।
      </div>
      <p class="gp-footer-link"><a href="login.html">← Login पर वापस जाएं</a></p>
    </div>

    <!-- नया password सेट करने का form — reset-link से यहीं वापस आता है (Supabase session-recovery mode) -->
    <div class="gp-card" id="resetCard" style="display:none">
      <h2>नया Password बनाएं</h2>
      <div id="resetAlert" class="gp-alert"></div>
      <form id="resetForm">
        <div class="gp-field">
          <label for="newPassword">नया Password</label>
          <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="gp-btn" id="resetSubmitBtn">Password सेट करें</button>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    // Supabase reset-link से वापस आने पर URL में एक विशेष recovery-session होता है
    gpSupabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        document.getElementById("requestCard").style.display = "none";
        document.getElementById("resetCard").style.display = "block";
      }
    });

    document.getElementById("fpForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      gpHideAlert("fpAlert");
      const btn = document.getElementById("fpSubmitBtn");
      btn.disabled = true;
      btn.textContent = "कृपया प्रतीक्षा करें...";

      const email = document.getElementById("email").value.trim();
      const { error } = await gpSupabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/forgot-password.html",
      });

      // सुरक्षा के लिए — email exist करे या ना करे, हमेशा एक जैसा success-message
      // (ताकि कोई ये पता ना लगा सके कि कौन सी email registered है)
      document.getElementById("sentToEmail").textContent = email;
      document.getElementById("requestCard").style.display = "none";
      document.getElementById("sentCard").style.display = "block";
    });

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      gpHideAlert("resetAlert");
      const btn = document.getElementById("resetSubmitBtn");
      btn.disabled = true;
      btn.textContent = "कृपया प्रतीक्षा करें...";

      const newPassword = document.getElementById("newPassword").value;
      const { error } = await gpSupabase.auth.updateUser({ password: newPassword });

      if (error) {
        gpShowAlert("resetAlert", "Password set नहीं हो सका — फिर कोशिश करें।", "error");
        btn.disabled = false;
        btn.textContent = "Password सेट करें";
        return;
      }

      gpShowAlert("resetAlert", "Password बदल गया! अब home पर भेजा जा रहा है...", "success");
      setTimeout(() => { window.location.href = "home.html"; }, 1500);
    });
  </script>
</body>
</html>
