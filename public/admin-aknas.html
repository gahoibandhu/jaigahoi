<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7a1f3d">
  <title>Admin — अकना Review</title>
  <link rel="stylesheet" href="common.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    .ak-wrap{max-width:820px;margin:18px auto;padding:0 16px 40px}
    .ak-card{background:var(--gp-card);border:1px solid var(--border-soft);border-radius:var(--gp-radius-lg);box-shadow:var(--gp-shadow);padding:14px 16px;margin-bottom:12px}
    .ak-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
    .ak-name{font-size:1.25rem;font-weight:800;color:var(--primary)}
    .ak-meta{font-size:.78rem;color:var(--gp-text-muted)}
    .ak-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
    .ak-box{background:var(--light);border-radius:10px;padding:10px 12px}
    .ak-box b{font-size:.82rem;color:var(--primary)}
    .ak-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
    .ak-row input{flex:1;min-width:130px;padding:8px 10px;border:1.5px solid var(--gp-border);border-radius:8px;font-family:inherit}
    .ak-row button,.ak-reject{padding:8px 14px;border-radius:8px;border:1.5px solid var(--gp-border);background:#fff;font-weight:700;cursor:pointer;font-family:inherit;font-size:.82rem}
    .ak-row .go{background:var(--success-soft);border-color:var(--success);color:var(--success)}
    .ak-reject{color:var(--error);border-color:var(--error);background:var(--error-soft);justify-self:start}
    .ak-empty{text-align:center;color:var(--gp-text-muted);padding:40px 0}
  </style>
</head>
<body>
  <div class="gp-header">
    <img src="https://res.cloudinary.com/dtcrife6i/image/upload/f_auto,q_auto/New_-_Logo_aktdtf.png" alt="गहोई पोर्टल">
    <div><h1>🏷 अकना Review</h1><div class="gp-header-sub">list में न मिले अकना — सही अकना से जोड़ें या नया बनाएँ</div></div>
  </div>
  <div class="ak-wrap">
    <a href="home.html" style="color:var(--primary);font-weight:600;text-decoration:none;font-size:.9rem">← Home</a>
    <div id="akAlert" class="gp-alert"></div>
    <div id="list"><div class="ak-empty">लोड हो रहा है...</div></div>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="akna-picker.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
    // akna-picker.js load न हो पाए तो भी form चले: साधारण text field की तरह (server अकना canonicalize कर ही देता है)
    function makeAknaPicker(el) {
      const input = typeof el === "string" ? document.getElementById(el) : el;
      try { if (typeof gpAknaPicker === "function") { const p = gpAknaPicker({ input }); if (p) return p; } } catch (e) {}
      return { value: () => input.value.trim(), recognized: () => false, setValue(v) { input.value = v || ""; } };
    }
    const hasDeva = (s) => /[\u0900-\u097F]/.test(s);

    async function act(id, action, args, okMsg) {
      gpHideAlert("akAlert");
      const { data, error } = await gpSupabase.rpc("resolve_pending_akna", { p_id: id, p_action: action, ...args });
      if (error) { gpShowAlert("akAlert", error.message, "error"); return; }
      gpShowAlert("akAlert", okMsg + (data && data.moved ? ` — ${data.moved} सदस्यों का अकना अपडेट हुआ।` : ""), "success");
      await load();
    }

    async function load() {
      const { data, error } = await gpSupabase.from("pending_aknas").select("*").eq("status", "Pending").order("seen_count", { ascending: false });
      if (error) { $("list").innerHTML = '<div class="ak-empty">Load नहीं हुआ: ' + esc(error.message) + "</div>"; return; }
      if (!data || !data.length) { $("list").innerHTML = '<div class="ak-empty">🎉 कोई pending अकना नहीं है।</div>'; return; }
      $("list").innerHTML = data.map((r) => `
        <div class="ak-card" data-id="${r.id}" data-akna="${esc(r.akna)}">
          <div class="ak-head"><span class="ak-name">${esc(r.akna)}</span><span class="ak-meta">${r.seen_count} सदस्य · पहला: ${esc(r.first_gahoi_id || "—")} · ${esc(String(r.created_at || "").slice(0, 10))}</span></div>
          <div class="ak-actions">
            <div class="ak-box"><b>1) सही अकना से जोड़ें (typo / दूसरी spelling)</b>
              <div class="ak-row"><input type="text" class="mapInput" placeholder="सही अकना लिखें — Hindi या English"><button class="go" data-a="map">जोड़ें</button></div></div>
            <div class="ak-box"><b>2) बिल्कुल नया अकना list में जोड़ें</b>
              <div class="ak-row"><input type="text" class="nHindi" placeholder="हिंदी नाम *" value="${hasDeva(r.akna) ? esc(r.akna) : ""}"><input type="text" class="nEng" placeholder="English" value="${hasDeva(r.akna) ? "" : esc(r.akna)}"><input type="text" class="nVar" placeholder="दूसरी spellings (वैकल्पिक)"><button class="go" data-a="add">➕ जोड़ें</button></div></div>
            <button class="ak-reject" data-a="reject">✖ Reject (list में नहीं जोड़ना)</button>
          </div>
        </div>`).join("");
      document.querySelectorAll(".ak-card").forEach((card) => { card._picker = makeAknaPicker(card.querySelector(".mapInput")); });
    }

    $("list").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-a]"); if (!b) return;
      const card = b.closest(".ak-card"), id = card.dataset.id, a = b.dataset.a, q = (s) => card.querySelector(s).value.trim();
      if (a === "map") {
        if (!card._picker.recognized()) { gpShowAlert("akAlert", "सूची में से सही अकना चुनें (लिखना शुरू करें, फिर सुझाव पर click करें)।", "error"); return; }
        act(id, "map", { p_hindi: card._picker.value() }, "✅ जोड़ दिया — यह spelling अब अपने-आप पहचानी जाएगी");
      } else if (a === "add") {
        if (!q(".nHindi")) { gpShowAlert("akAlert", "हिंदी नाम ज़रूरी है।", "error"); return; }
        act(id, "add", { p_hindi: q(".nHindi"), p_english: q(".nEng"), p_variants: q(".nVar") }, "✅ नया अकना list में जुड़ गया");
      } else if (a === "reject") {
        if (confirm("इस अकना को reject करें?")) act(id, "reject", {}, "Reject हो गया");
      }
    });

    (async () => {
      const session = await gpRequireLogin("login.html"); if (!session) return;
      const me = await gpGetMyProfile();
      if (!me || (me.role !== "Admin" && me.role !== "Approver")) { window.location.href = "home.html"; return; }
      await load();
    })();
  </script>
</body>
</html>
