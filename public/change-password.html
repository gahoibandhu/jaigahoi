<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7a1f3d">
  <title>Password बदलें — गहोई पोर्टल</title>
  <link rel="stylesheet" href="common.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="gp-header">
    <img src="https://res.cloudinary.com/dtcrife6i/image/upload/f_auto,q_auto/New_-_Logo_aktdtf.png" alt="गहोई पोर्टल">
    <div><h1>गहोई पोर्टल</h1><p class="gp-header-sub">All India Gahoi Vaishya Samaj Community Portal</p></div>
  </div>

  <div class="gp-container">
    <div class="gp-card">
      <h2 id="cpTitle">🔑 Password बदलें</h2>
      <p class="gp-subtitle" id="cpSub">सुरक्षा के लिए पहले मौजूदा password डालें</p>
      <div id="cpAlert" class="gp-alert"></div>
      <form id="cpForm">
        <div class="gp-field au-pw" id="curWrap"><label for="curPassword">मौजूदा Password</label><input type="password" id="curPassword" autocomplete="current-password"><button type="button" class="au-eye" id="curEye" aria-label="Password दिखाएँ">👁</button></div>
        <div class="gp-field au-pw"><label for="newPassword">नया Password</label><input type="password" id="newPassword" required minlength="8" autocomplete="new-password"><button type="button" class="au-eye" id="newEye" aria-label="Password दिखाएँ">👁</button><div class="gp-hint">कम से कम 8 अक्षर — अक्षर और अंक दोनों</div></div>
        <div class="gp-field"><label for="confirmPassword">नया Password दोबारा</label><input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password"></div>
        <button type="submit" class="gp-btn" id="cpBtn">Password बदलें</button>
      </form>
      <p class="gp-footer-link"><a href="forgot-password.html" id="forgotLink">मौजूदा Password याद नहीं?</a> · <a href="home.html">← Home</a></p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="auth.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let user = null, hasPassword = true;

    (async () => {
      const session = await gpRequireLogin("login.html");
      if (!session) return;
      user = session.user;
      const identities = (user.identities || []).map((i) => i.provider);
      // Google/Phone-only account में अभी कोई password है ही नहीं — तब "Password सेट करें" mode
      hasPassword = !!user.email && identities.includes("email");
      if (!hasPassword) {
        $("cpTitle").textContent = "🔑 Password सेट करें";
        $("cpSub").textContent = "आपका account अभी बिना password का है (Google/Mobile से बना) — चाहें तो एक password बना लें।";
        $("curWrap").style.display = "none"; $("cpBtn").textContent = "Password सेट करें"; $("forgotLink").style.display = "none";
      }
    })();

    $("cpForm").addEventListener("submit", async (e) => {
      e.preventDefault(); gpHideAlert("cpAlert");
      const cur = $("curPassword").value, pw = $("newPassword").value;
      const problem = gpPasswordProblem(pw);
      if (problem) { gpShowAlert("cpAlert", problem, "error"); return; }
      if (pw !== $("confirmPassword").value) { gpShowAlert("cpAlert", "दोनों नए Password एक जैसे नहीं हैं।", "error"); return; }
      if (hasPassword) {
        if (!cur) { gpShowAlert("cpAlert", "मौजूदा Password डालें।", "error"); return; }
        if (cur === pw) { gpShowAlert("cpAlert", "नया password पुराने से अलग होना चाहिए।", "error"); return; }
      }
      const btn = $("cpBtn"); btn.disabled = true; btn.textContent = "कृपया प्रतीक्षा करें...";

      if (hasPassword) {   // मौजूदा password की असली जाँच (सिर्फ़ session होना काफ़ी नहीं — खुला फ़ोन/laptop भी हो सकता है)
        const { error: verr } = await gpSupabase.auth.signInWithPassword({ email: user.email, password: cur });
        if (verr) { gpShowAlert("cpAlert", "मौजूदा Password ग़लत है।", "error"); btn.disabled = false; btn.textContent = "Password बदलें"; return; }
      }
      const { error } = await gpSupabase.auth.updateUser({ password: pw });
      if (error) {
        gpShowAlert("cpAlert", /same|different/i.test(error.message || "") ? "नया password पुराने से अलग होना चाहिए।" : "Password बदल नहीं सका — फिर कोशिश करें।", "error");
        btn.disabled = false; btn.textContent = hasPassword ? "Password बदलें" : "Password सेट करें"; return;
      }
      await gpSupabase.auth.signOut({ scope: "others" });   // बाक़ी devices से logout; ये device logged-in रहता है
      gpShowAlert("cpAlert", "✅ Password बदल गया। बाक़ी सभी devices से logout कर दिया गया है।", "success");
      $("cpForm").reset(); btn.disabled = false; btn.textContent = hasPassword ? "Password बदलें" : "Password सेट करें";
      hasPassword = true; $("curWrap").style.display = "";
    });
    gpWirePasswordToggle("curPassword", "curEye"); gpWirePasswordToggle("newPassword", "newEye");
  </script>
</body>
</html>
